<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VSPC Monitoring</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background: #f0f2f5; }
    .navbar { background: #005f8e; }
    .card-header { font-weight: 600; }
    .badge-error   { background: #dc3545; }
    .badge-warning { background: #fd7e14; }
    .badge-resolved{ background: #198754; }
    .badge-info    { background: #0dcaf0; color: #000; }
    .status-dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; margin-right: 6px;
    }
    .dot-error   { background: #dc3545; }
    .dot-warning { background: #fd7e14; }
    .dot-resolved{ background: #198754; }
    .dot-info    { background: #0dcaf0; }
    .dot-unknown { background: #6c757d; }
    #alarm-table th { cursor: pointer; user-select: none; white-space: nowrap; }
    #alarm-table th .bi-sort-up,
    #alarm-table th .bi-sort-down { font-size: 0.75rem; }
    .table-hover tbody tr:hover { background: #e9f0f7; }
    .spinner-wrap { min-height: 200px; display: flex; align-items: center; justify-content: center; }
    .stat-card { transition: transform .15s; }
    .stat-card:hover { transform: translateY(-2px); }
    .org-badge { font-size: .75rem; }
    .alarm-msg  { max-width: 320px; white-space: pre-wrap; word-break: break-word; font-size: .82rem; }
    .last-updated { font-size: .8rem; color: #6c757d; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3 mb-4">
  <span class="navbar-brand fw-bold fs-5">
    <i class="bi bi-shield-check me-2"></i>VSPC Monitoring
  </span>
  <div class="d-flex align-items-center gap-3">
    <span class="last-updated text-white-50" id="last-updated"></span>
    <button class="btn btn-outline-light btn-sm" onclick="loadData()">
      <i class="bi bi-arrow-clockwise me-1"></i>Refresh
    </button>
  </div>
</nav>

<div class="container-fluid px-4">

  <!-- Summary cards -->
  <div class="row g-3 mb-4" id="summary-cards">
    <div class="col-6 col-md-3">
      <div class="card stat-card border-0 shadow-sm text-center py-3">
        <div class="card-body">
          <div class="fs-1 fw-bold text-danger" id="cnt-error">–</div>
          <div class="text-muted small">Errors</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card stat-card border-0 shadow-sm text-center py-3">
        <div class="card-body">
          <div class="fs-1 fw-bold text-warning" id="cnt-warning">–</div>
          <div class="text-muted small">Warnings</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card stat-card border-0 shadow-sm text-center py-3">
        <div class="card-body">
          <div class="fs-1 fw-bold text-success" id="cnt-resolved">–</div>
          <div class="text-muted small">Resolved</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card stat-card border-0 shadow-sm text-center py-3">
        <div class="card-body">
          <div class="fs-1 fw-bold text-secondary" id="cnt-orgs">–</div>
          <div class="text-muted small">Organizations</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Filter row -->
  <div class="card border-0 shadow-sm mb-3">
    <div class="card-body py-2">
      <div class="row g-2 align-items-center">
        <div class="col-md-4">
          <input type="text" class="form-control form-control-sm" id="search-input"
                 placeholder="Search (name, object, message…)" oninput="applyFilters()" />
        </div>
        <div class="col-md-2">
          <select class="form-select form-select-sm" id="filter-status" onchange="applyFilters()">
            <option value="">All Status</option>
            <option value="Error">Error</option>
            <option value="Warning">Warning</option>
            <option value="Resolved">Resolved</option>
            <option value="Info">Info</option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-select form-select-sm" id="filter-org" onchange="applyFilters()">
            <option value="">All Organizations</option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-select form-select-sm" id="filter-area" onchange="applyFilters()">
            <option value="">All Areas</option>
            <option value="vspc">VSPC</option>
            <option value="vone">VOne</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Alarms table -->
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <span><i class="bi bi-bell-fill text-danger me-2"></i>Active Alarms</span>
      <span class="badge bg-secondary" id="alarm-count">0</span>
    </div>
    <div class="card-body p-0">
      <div id="alarm-spinner" class="spinner-wrap">
        <div class="spinner-border text-primary"></div>
      </div>
      <div id="alarm-error" class="alert alert-danger m-3 d-none"></div>
      <div id="alarm-table-wrap" class="d-none table-responsive">
        <table class="table table-hover mb-0" id="alarm-table">
          <thead class="table-light">
            <tr>
              <th data-col="status" onclick="sortBy('status')">Status <i class="bi bi-sort-up"></i></th>
              <th data-col="time"   onclick="sortBy('time')">Time <i class="bi"></i></th>
              <th data-col="org"    onclick="sortBy('org')">Organization <i class="bi"></i></th>
              <th data-col="object" onclick="sortBy('object')">Object <i class="bi"></i></th>
              <th>Area</th>
              <th data-col="repeat" onclick="sortBy('repeat')">Rep. <i class="bi"></i></th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody id="alarm-tbody"></tbody>
        </table>
        <div id="no-results" class="text-center text-muted py-4 d-none">No alarms found.</div>
      </div>
    </div>
  </div>

  <!-- Organizations table -->
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-header bg-white">
      <i class="bi bi-building me-2 text-primary"></i>Organizations
    </div>
    <div class="card-body p-0">
      <div id="org-spinner" class="spinner-wrap">
        <div class="spinner-border text-primary"></div>
      </div>
      <div id="org-table-wrap" class="d-none table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>E-Mail</th>
              <th>City</th>
              <th>Country</th>
              <th>Active Alarms</th>
            </tr>
          </thead>
          <tbody id="org-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
let allAlarms = [];
let orgMap = {};
let sortCol = 'time';
let sortDir = -1; // -1 = desc

function statusBadge(status) {
  const map = {
    Error:    'badge-error',
    Warning:  'badge-warning',
    Resolved: 'badge-resolved',
    Info:     'badge-info',
  };
  const dot = {
    Error:    'dot-error',
    Warning:  'dot-warning',
    Resolved: 'dot-resolved',
    Info:     'dot-info',
  };
  const cls = map[status] || 'bg-secondary';
  const dcls = dot[status] || 'dot-unknown';
  return `<span class="badge ${cls}"><span class="status-dot ${dcls}"></span>${status ?? '–'}</span>`;
}

function fmtTime(iso) {
  if (!iso) return '–';
  try {
    return new Date(iso).toLocaleString('en-GB', {dateStyle:'short', timeStyle:'medium'});
  } catch { return iso; }
}

function sortBy(col) {
  if (sortCol === col) { sortDir *= -1; }
  else { sortCol = col; sortDir = -1; }
  document.querySelectorAll('#alarm-table th[data-col] i').forEach(i => i.className = 'bi');
  const th = document.querySelector(`#alarm-table th[data-col="${col}"] i`);
  if (th) th.className = sortDir === 1 ? 'bi bi-sort-up' : 'bi bi-sort-down';
  applyFilters();
}

function getVal(alarm, col) {
  if (col === 'status') return alarm.lastActivation?.status ?? '';
  if (col === 'time')   return alarm.lastActivation?.time ?? '';
  if (col === 'org')    return (orgMap[alarm.object?.organizationUid]?.name ?? '').toLowerCase();
  if (col === 'object') return (alarm.object?.objectName ?? '').toLowerCase();
  if (col === 'repeat') return alarm.repeatCount ?? 0;
  return '';
}

function applyFilters() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const fStatus = document.getElementById('filter-status').value;
  const fOrg    = document.getElementById('filter-org').value;
  const fArea   = document.getElementById('filter-area').value;

  let filtered = allAlarms.filter(a => {
    const status = a.lastActivation?.status ?? '';
    const orgUid = a.object?.organizationUid ?? '';
    const area   = a.area ?? '';
    const text   = [
      a.object?.objectName, a.object?.computerName,
      a.lastActivation?.message,
      orgMap[orgUid]?.name
    ].join(' ').toLowerCase();

    if (fStatus && status !== fStatus) return false;
    if (fOrg    && orgUid !== fOrg)    return false;
    if (fArea   && area !== fArea)     return false;
    if (search  && !text.includes(search)) return false;
    return true;
  });

  // sort
  filtered.sort((a, b) => {
    const va = getVal(a, sortCol);
    const vb = getVal(b, sortCol);
    if (va < vb) return -1 * sortDir;
    if (va > vb) return  1 * sortDir;
    return 0;
  });

  document.getElementById('alarm-count').textContent = filtered.length;
  const tbody = document.getElementById('alarm-tbody');
  tbody.innerHTML = '';
  document.getElementById('no-results').classList.toggle('d-none', filtered.length > 0);

  filtered.forEach(a => {
    const la  = a.lastActivation ?? {};
    const obj = a.object ?? {};
    const org = orgMap[obj.organizationUid];
    const tr  = document.createElement('tr');
    tr.innerHTML = `
      <td>${statusBadge(la.status)}</td>
      <td class="text-nowrap">${fmtTime(la.time)}</td>
      <td>${org ? `<span class="badge bg-light text-dark border org-badge">${escHtml(org.name)}</span>` : '<span class="text-muted">–</span>'}</td>
      <td>${escHtml(obj.objectName || obj.computerName || '–')}</td>
      <td><span class="badge bg-light text-dark border">${escHtml(a.area ?? '–')}</span></td>
      <td class="text-center">${a.repeatCount ?? 0}</td>
      <td><div class="alarm-msg">${escHtml(la.message ?? '–')}</div></td>
    `;
    tbody.appendChild(tr);
  });
}

function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function populateOrgFilter(orgs) {
  const sel = document.getElementById('filter-org');
  orgs.sort((a,b) => a.name.localeCompare(b.name)).forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.instanceUid;
    opt.textContent = o.name;
    sel.appendChild(opt);
  });
}

function renderOrgs(orgs, alarms) {
  const alarmsByOrg = {};
  alarms.forEach(a => {
    const uid = a.object?.organizationUid;
    if (!uid) return;
    alarmsByOrg[uid] = (alarmsByOrg[uid] || 0) + 1;
  });

  const tbody = document.getElementById('org-tbody');
  tbody.innerHTML = '';
  orgs.sort((a,b) => a.name.localeCompare(b.name)).forEach(o => {
    const cnt = alarmsByOrg[o.instanceUid] ?? 0;
    const cntBadge = cnt > 0
      ? `<span class="badge bg-danger">${cnt}</span>`
      : `<span class="badge bg-success">0</span>`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="fw-semibold">${escHtml(o.name)}</td>
      <td><span class="badge bg-light text-dark border">${escHtml(o.type ?? '–')}</span></td>
      <td>${escHtml(o.email ?? '–')}</td>
      <td>${escHtml(o.city ?? '–')}</td>
      <td>${escHtml(o.countryName ?? '–')}</td>
      <td>${cntBadge}</td>
    `;
    tbody.appendChild(tr);
  });
  document.getElementById('org-spinner').classList.add('d-none');
  document.getElementById('org-table-wrap').classList.remove('d-none');
}

async function loadData() {
  document.getElementById('alarm-spinner').classList.remove('d-none');
  document.getElementById('alarm-table-wrap').classList.add('d-none');
  document.getElementById('alarm-error').classList.add('d-none');
  document.getElementById('org-spinner').classList.remove('d-none');
  document.getElementById('org-table-wrap').classList.add('d-none');

  try {
    const res = await fetch('/api/data');
    const json = await res.json();

    if (json.error) {
      const errEl = document.getElementById('alarm-error');
      errEl.textContent = 'Error: ' + json.error;
      errEl.classList.remove('d-none');
      document.getElementById('alarm-spinner').classList.add('d-none');
      document.getElementById('org-spinner').classList.add('d-none');
      return;
    }

    allAlarms = json.alarms ?? [];
    orgMap    = json.org_map ?? {};
    const orgs = json.organizations ?? [];

    // Summary counts
    const counts = { Error: 0, Warning: 0, Resolved: 0 };
    allAlarms.forEach(a => {
      const s = a.lastActivation?.status;
      if (s in counts) counts[s]++;
    });
    document.getElementById('cnt-error').textContent   = counts.Error;
    document.getElementById('cnt-warning').textContent = counts.Warning;
    document.getElementById('cnt-resolved').textContent= counts.Resolved;
    document.getElementById('cnt-orgs').textContent    = orgs.length;

    populateOrgFilter(orgs);
    renderOrgs(orgs, allAlarms);
    applyFilters();

    document.getElementById('alarm-spinner').classList.add('d-none');
    document.getElementById('alarm-table-wrap').classList.remove('d-none');

    const now = new Date().toLocaleString('en-GB', {dateStyle:'short', timeStyle:'medium'});
    document.getElementById('last-updated').textContent = 'Updated: ' + now;

  } catch (err) {
    const errEl = document.getElementById('alarm-error');
    errEl.textContent = 'Network error: ' + err.message;
    errEl.classList.remove('d-none');
    document.getElementById('alarm-spinner').classList.add('d-none');
    document.getElementById('org-spinner').classList.add('d-none');
  }
}

loadData();
</script>
</body>
</html>
